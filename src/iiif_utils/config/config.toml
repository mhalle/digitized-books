default_provider = "generic"

[providers.generic]
type = "iiif_generic"
ocr_preference = ["alto", "rendering_text", "content_search"]

[providers.wellcome]
type = "wellcome"
catalogue_api = "https://api.wellcomecollection.org/catalogue/v2"
iiif_base = "https://iiif.wellcomecollection.org"
ocr_preference = ["alto", "rendering_text", "content_search"]

[providers.loc]
type = "loc"
catalogue_api = "https://www.loc.gov"
iiif_image_base = "https://tile.loc.gov/image-services/iiif"
# LoC has no Presentation manifest — the adapter synthesizes one in
# memory from the item-level `?fo=json` payload.
ocr_preference = ["alto", "text_rendering"]
# LoC rate-limits aggressively (429 at ~8 concurrent). Be polite.
max_concurrency = 2

[providers.mdz]
type = "mdz"
iiif_base = "https://api.digitale-sammlungen.de"
# MDZ has IIIF v2 manifests but per-canvas hOCR is at /ocr/{bsb}/{N},
# not in the manifest seeAlso. Adapter fetches the manifest and
# injects hOCR URLs as canvas seeAlso entries.
ocr_preference = ["hocr"]

[providers.heidelberg]
type = "heidelberg"
iiif_base = "https://digi.ub.uni-heidelberg.de"
# Heidelberg has IIIF v2 manifests with a manifest-level seeAlso to METS.
# The METS FULLTEXT fileGrp lists per-page ALTO URLs (served via
# /cgi-bin/get_ocr.cgi). Adapter fetches manifest + METS and injects
# ALTO URLs as canvas seeAlso entries.
ocr_preference = ["alto"]

[providers.gallica]
type = "gallica"
iiif_base = "https://gallica.bnf.fr"
# Gallica has IIIF v2 manifests but per-page ALTO is at a separate
# RequestDigitalElement endpoint keyed by ARK + folio number. Adapter
# fetches the manifest and injects per-canvas ALTO URLs as seeAlso.
ocr_preference = ["alto"]
# Gallica throttles aggressively on req/s, not on concurrent connections.
# Cap to 1 concurrent + 250ms inter-request floor (~4 req/s, comfortably
# below the documented ~5 req/s ceiling). Keep the retry budget short —
# the previous 12-retry / 2048s tail caused multi-hour hangs when a work
# got persistently throttled. 6 retries × 1s base = max ~63s per request.
# Better to fail fast and re-run than hang silently.
max_concurrency = 1
request_interval_seconds = 0.25
max_retries = 6
retry_base_seconds = 1.0

[providers.ia]
type = "ia"
iiif_base = "https://iiif.archive.org"
# Internet Archive has IIIF v3 manifests with Image API v3 services, but
# hOCR is served as one monolithic file per item (not per canvas), so
# this adapter does NOT inject per-canvas OCR seeAlso. The iiif-utils
# indexing pipeline expects per-canvas OCR; for full-text indexing of
# IA items, use the sibling ia-utils package, which consumes IA's
# native searchtext + pageindex fast path.
ocr_preference = []

[http]
user_agent = "iiif-utils/0.1"
timeout_seconds = 60
max_concurrency = 8
cache_dir = "./.iiif-cache"

[output]
default_format = "table"
