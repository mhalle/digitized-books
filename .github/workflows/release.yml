name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The bundle's root directory name, NOT the repository name. The Agent
# Skills spec requires the skill directory to match SKILL.md's `name`,
# so this is pinned rather than derived from `github.event.repository.name`
# — that way the bundle validates even if the repo is named something else.
env:
  SKILL_NAME: digitized-books

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve version
        id: info
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BARE=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Pin the version for git-less installs
        run: |
          # The shipped bundle has no .git, so hatch-vcs cannot derive a
          # version at install time. Write it out explicitly and patch the
          # fallback so a bundle-only install still reports the right one.
          BARE="${{ steps.info.outputs.BARE }}"
          printf '%s\n' \
            "# Generated by the release workflow from tag v${BARE}." \
            "# Not tracked in version control." \
            "__version__ = version = \"${BARE}\"" \
            > src/iiif_utils/_version.py
          sed -i "s/^fallback-version = .*/fallback-version = \"${BARE}\"/" pyproject.toml
          cat src/iiif_utils/_version.py
          grep fallback-version pyproject.toml

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build the wheel into the bundle
        run: |
          # The launcher prefers this wheel, which is what makes the
          # bundle work when it is mounted read-only: no build backend,
          # no git, and nothing written into the skill directory.
          rm -f wheels/*.whl
          uv build --wheel -o wheels
          ls -l wheels/

      - name: Validate the skill
        run: |
          # Validate under the real bundle directory name — the spec
          # requires it to match SKILL.md's `name`.
          mkdir -p "/tmp/stage/${SKILL_NAME}"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.venv' \
                   --exclude='.pytest_cache' --exclude='.mypy_cache' \
                   --exclude='.ruff_cache' --exclude='__pycache__' \
                   --exclude='*.pyc' --exclude='.DS_Store' \
                   --exclude='*.sqlite' --exclude='.iiif-cache' \
                   . "/tmp/stage/${SKILL_NAME}/"
          uvx --from skills-ref agentskills validate "/tmp/stage/${SKILL_NAME}"

      - name: Smoke-test the bundle read-only
        run: |
          # Exactly how a user runs it: read-only, no git, no checkout.
          chmod -R a-w "/tmp/stage/${SKILL_NAME}"
          "/tmp/stage/${SKILL_NAME}/scripts/iiif-utils" --version
          chmod -R u+w "/tmp/stage/${SKILL_NAME}"

      - name: Package
        run: |
          VERSION="${{ steps.info.outputs.VERSION }}"
          cd /tmp/stage
          zip -qr "$GITHUB_WORKSPACE/${SKILL_NAME}-${VERSION}.zip" "${SKILL_NAME}"
          cd "$GITHUB_WORKSPACE"
          cp "${SKILL_NAME}-${VERSION}.zip" "${SKILL_NAME}-${VERSION}.skill"
          cp "${SKILL_NAME}-${VERSION}.zip" "${SKILL_NAME}.zip"
          cp "${SKILL_NAME}-${VERSION}.zip" "${SKILL_NAME}.skill"
          ls -l ${SKILL_NAME}*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.SKILL_NAME }}-${{ steps.info.outputs.VERSION }}.zip
            ${{ env.SKILL_NAME }}-${{ steps.info.outputs.VERSION }}.skill
            ${{ env.SKILL_NAME }}.zip
            ${{ env.SKILL_NAME }}.skill
