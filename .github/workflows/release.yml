name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The bundle's root directory name, NOT the repository name. The Agent
# Skills spec requires the skill directory to match SKILL.md's `name`,
# so this is pinned rather than derived from `github.event.repository.name`
# — that way the bundle validates even if the repo is named something else.
env:
  SKILL_NAME: digitized-books

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve version
        id: info
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BARE=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Verify HEAD is exactly the tag
        run: |
          # The whole scheme rests on this: hatch-vcs reads `git describe`,
          # so if HEAD is not exactly the tag the artifact silently carries
          # a dev version instead of the release.
          DESCRIBED="$(git describe --tags --dirty)"
          echo "git describe: ${DESCRIBED}"
          if [ "${DESCRIBED}" != "${{ steps.info.outputs.VERSION }}" ]; then
            echo "::error::HEAD describes as '${DESCRIBED}', expected '${{ steps.info.outputs.VERSION }}'"
            exit 1
          fi

      - name: Run tests, lint, types
        run: |
          # --extra dev is required: without it pytest/ruff/mypy are not
          # installed and this fails with "Failed to spawn: pytest".
          uv sync --frozen --extra dev
          uv run pytest -q
          uv run ruff check src/ tests/
          uv run mypy src/

      - name: Build and validate the bundle
        run: |
          # Same script used for local builds, so the released artifact
          # is identical to one you can test by hand — and there is only
          # one exclusion list to keep correct.
          sh scripts/build-skill.sh "$GITHUB_WORKSPACE/dist"

      - name: Name the release artifacts
        run: |
          # build-skill.sh also emits one archive per sibling skill under
          # skills/ — a .skill archive must contain exactly one SKILL.md,
          # so they cannot ride inside the main bundle.
          VERSION="${{ steps.info.outputs.VERSION }}"
          cp "dist/${SKILL_NAME}.skill" "${SKILL_NAME}-${VERSION}.skill"
          cp "dist/${SKILL_NAME}.skill" "${SKILL_NAME}-${VERSION}.zip"
          cp "dist/${SKILL_NAME}.skill" "${SKILL_NAME}.zip"
          cp "dist/${SKILL_NAME}.skill" "${SKILL_NAME}.skill"
          for f in dist/*.skill; do
            n="$(basename "$f" .skill)"
            [ "$n" = "${SKILL_NAME}" ] && continue
            cp "$f" "${n}.skill"
          done
          ls -l *.skill *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.SKILL_NAME }}-${{ steps.info.outputs.VERSION }}.zip
            ${{ env.SKILL_NAME }}-${{ steps.info.outputs.VERSION }}.skill
            ${{ env.SKILL_NAME }}.zip
            ${{ env.SKILL_NAME }}.skill
            build-outline.skill
