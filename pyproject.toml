[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "iiif-utils"
dynamic = ["version"]
description = "CLI tool for indexing and downloading from IIIF digitized collections"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx[http2]>=0.27",
    "sqlite-utils>=3.35",
    "lxml>=4.9",
    "pillow>=10.0",
    "pytesseract>=0.3.10",   # `ocr-page` — needs tesseract binary installed
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
iiif-utils = "iiif_utils.cli:cli"

[tool.uv]
managed = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/iiif_utils/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iiif_utils"]

[tool.hatch.build.targets.wheel.force-include]
"src/iiif_utils/config/config.toml" = "iiif_utils/config/config.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/iiif_utils"]

[[tool.mypy.overrides]]
module = ["lxml.*", "sqlite_utils.*", "pytesseract.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# _version.py is generated by hatch-vcs at build time and deleted from the
# source tree afterwards (see docs/RELEASING.md), so whether mypy can see
# it depends on when you last built. Configured here rather than with an
# inline ignore, which would itself become an unused-ignore error under
# `strict` on the builds where the file does exist.
[[tool.mypy.overrides]]
module = ["iiif_utils._version"]
ignore_missing_imports = true
follow_untyped_imports = true
